name: Build themes

on:
  push:
    paths:
      - "themes/**"
      - "rules.scss"
      - "dist/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch supersedes a build still in progress.
concurrency:
  group: build-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add a letter to $css-version if the push changed sources without bumping it
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            # New branch: compare against where it left main.
            before=$(git merge-base HEAD origin/main)
          fi
          if git diff --quiet "$before" HEAD -- themes rules.scss; then
            echo "No theme or rules changes"
          elif git diff "$before" HEAD -- rules.scss | grep -q '^[-+]\$css-version:'; then
            echo "\$css-version was already bumped"
          else
            npm run bump -- --letter
          fi
      - name: Rebuild dist/ and check it compiles
        run: npm run build
      # Only push runs commit; the pull_request run for the same push would race it.
      - name: Commit rebuilt dist/
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain -- dist rules.scss)" ]; then
            echo "dist/ is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          message="Rebuild dist/"
          if ! git diff --quiet -- rules.scss; then
            message="Bump \$css-version to $(sed -n 's/^\$css-version: "\(.*\)";/\1/p' rules.scss) and rebuild dist/"
          fi
          git add dist rules.scss
          # [skip ci]: the sources were just checked, and bot-triggered runs wait for manual approval.
          git commit -m "$message [skip ci]"
          built_on=$(git rev-parse HEAD~1)
          if ! git push; then
            remote=$(git ls-remote origin "refs/heads/${{ github.ref_name }}" | cut -f1)
            if [ "$remote" != "$built_on" ]; then
              echo "The branch moved on during this build; the newer push's run rebuilds dist/."
              exit 0
            fi
            exit 1
          fi
