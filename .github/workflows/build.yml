name: Build themes

on:
  push:
    paths:
      - "themes/**"
      - "rules.scss"
      - "dist/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch supersedes a build still in progress.
concurrency:
  group: build-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild dist/ and check it compiles
        run: npm run build
      # Only push runs commit; the pull_request run for the same push would race it.
      - name: Commit rebuilt dist/
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain -- dist)" ]; then
            echo "dist/ is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add dist
          # [skip ci]: the sources were just checked, and bot-triggered runs wait for manual approval.
          git commit -m "Rebuild dist/ [skip ci]"
          built_on=$(git rev-parse HEAD~1)
          if ! git push; then
            remote=$(git ls-remote origin "refs/heads/${{ github.ref_name }}" | cut -f1)
            if [ "$remote" != "$built_on" ]; then
              echo "The branch moved on during this build; the newer push's run rebuilds dist/."
              exit 0
            fi
            exit 1
          fi
